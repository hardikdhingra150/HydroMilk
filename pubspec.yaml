name: peach_ledger
description: HydraMilk — simple milk and water bills for the whole family.
publish_to: none
version: 3.0.0+5
environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.18.3
  uuid: ^4.5.2
  share_plus: ^12.0.1
  cross_file: ^0.3.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0
  url_launcher_platform_interface: ^2.3.2
flutter:
  uses-material-design: true
  assets:
    - assets/peach_pup.png
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
